        // round-summary is what makes the round boundary auto-deliver instead of
        // forcing the "Send to X for Round N" tap.
        const isSenderHandoff = g.turnFor !== g.myRole
          && (state.screen === 'share' || state.screen === 'game-over'
              || state.screen === 'round-summary');
        if (!isSenderHandoff) return;
        const enc = encodeGame(g);
        if (lastPushedRef.current[g.id] === enc) return;
        lastPushedRef.current[g.id] = enc;
        pushAndTrack(g);
      }, [state, authed]);

      // Retry a failed outgoing push when the tab regains focus (e.g. the network
      // came back at the airport). Reads via refs so it doesn't churn listeners.
      useEffect(() => {
        if (!authed || !RELAY_URL) return;
        const onVis = () => {
          if (document.hidden) return;
          const g = getCurrentGame(stateRef.current);
          if (!g || g.mode !== 'r' || g.myRole === undefined) return;
          if (g.turnFor === g.myRole) return;
          if (syncStatusRef.current[g.id] !== 'failed') return;
          pushAndTrack(g);
        };
        document.addEventListener('visibilitychange', onVis);
        return () => document.removeEventListener('visibilitychange', onVis);
      }, [authed]);

      // Relay pull: for any match where we're waiting on the opponent, poll the
      // relay on an interval (and immediately on focus) and load a turn the
      // moment it arrives. The LOAD_FROM_URL turnCounter guard makes a no-change
      // fetch idempotent; we also pre-check the counter to avoid no-op dispatch.
      useEffect(() => {
        if (!authed || !RELAY_URL) return;
        const waiting = Object.values(state.games).filter(isWaitingRemote);
        if (waiting.length === 0) return;
        let cancelled = false;
        const poll = async () => {
          if (document.hidden) return;
          for (const g of waiting) {
            const incoming = await relayGet(g.id);
            if (cancelled || !incoming || incoming.turnCounter === undefined) continue;
            const local = state.games[g.id];
            if (local && local.turnCounter !== undefined
                && incoming.turnCounter > local.turnCounter) {
              dispatch({ type: 'RELAY_SYNC', game: incoming });
            }
          }
        };
        poll();
        const onVis = () => { if (!document.hidden) poll(); };
        const interval = setInterval(poll, RELAY_POLL_MS);
        document.addEventListener('visibilitychange', onVis);
        return () => {
          cancelled = true;
          clearInterval(interval);
          document.removeEventListener('visibilitychange', onVis);
        };
      }, [state, authed]);

      const onLogout = useCallback(() => {
        clearAuth();
        clearSaves();
        dispatch({ type: 'RESET' });
        setAuthed(false);
      }, []);

      if (!authed) return html`<${Login} onSuccess=${() => setAuthed(true)} />`;

      switch (state.screen) {
        case 'home':              return html`<${Home} state=${state} dispatch=${dispatch} onLogout=${onLogout} syncStatus=${syncStatus} />`;
        case 'setup':             return html`<${Setup} state=${state} dispatch=${dispatch} />`;
        case 'mode-chooser':      return html`<${ModeChooser} state=${state} dispatch=${dispatch} />`;
        case 'accept-challenge':  return html`<${AcceptChallenge} state=${state} dispatch=${dispatch} />`;
        case 'word-entry':        return html`<${WordEntry} state=${state} dispatch=${dispatch} />`;
        case 'handoff':           return html`<${Handoff} state=${state} dispatch=${dispatch} />`;
        case 'share':             return html`<${ShareScreen} state=${state} dispatch=${dispatch} syncStatus=${syncStatus} />`;
        case 'review':            return html`<${ReviewBoard} state=${state} dispatch=${dispatch} />`;
        case 'game':              return html`<${Game} state=${state} dispatch=${dispatch} />`;
        case 'solo-summary':      return html`<${SoloSummary} state=${state} dispatch=${dispatch} />`;
        case 'round-summary':     return html`<${RoundSummary} state=${state} dispatch=${dispatch} syncStatus=${syncStatus} />`;
        case 'game-over':         return html`<${GameOver} state=${state} dispatch=${dispatch} syncStatus=${syncStatus} />`;
        default:                  return html`<${Home} state=${state} dispatch=${dispatch} onLogout=${onLogout} syncStatus=${syncStatus} />`;
      }
    }

    // Small attribution + IP-respect notice shown at the bottom of the
    // login and home screens. Kept text-only so it can scale freely on tiny
    // viewports without competing with the action UI.
    function Disclaimer() {
      return html`
        <div class="disclaimer">
          Inspired by Wordle® by The New York Times Company.
          Twordle is an independent personal project — not affiliated with,
          endorsed by, or sponsored by NYT. Made in the spirit of fair use,
          with respect for the original's intellectual property.
        </div>
      `;
    }

    // Collapsible "How it works" — the 2P scoring isn't obvious, and the invited
    // friend (who never sees ModeChooser) most needs it, so it lives on both
    // entry points (ModeChooser + AcceptChallenge).
    function RulesBlurb() {
      const [open, setOpen] = useState(false);
      return html`
        <div class="rules-blurb">
          <button class="rules-toggle" onClick=${() => setOpen(o => !o)}>
            ${open ? '▾' : '▸'} How it works
          </button>
          ${open && html`
            <div class="rules-body">
              <p>You each secretly pick <strong>3 words</strong> for the other to guess — one per round, 3 rounds.</p>
              <p>Solve each in as few guesses as you can. After 3 rounds, <strong>lowest total guess count wins</strong>.</p>
              <p>If one of you cracks a word the other can't, that's an <strong>instant win</strong>. A stumped word counts as 6.</p>
            </div>
          `}
        </div>
      `;
    }

    function Login({ onSuccess }) {
      const [pw, setPw] = useState('');
      const [show, setShow] = useState(false);
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState(false);
      const inputRef = useRef(null);

      useEffect(() => { inputRef.current?.focus(); }, []);

      const submit = async () => {
        if (busy) return;
        setBusy(true);
        const digest = await sha256(AUTH_SALT + pw);
        if (digest === AUTH_HASH) {
          writeAuth();
          onSuccess();
        } else {
          setErr('Incorrect password.');
          setBusy(false);
          inputRef.current?.select();
        }
      };

      return html`
        <div id="s-login" class="screen">
          <div class="login-body">
            <div class="login-logo">TWORDLE</div>
            <div class="login-sub">Enter the password to play</div>
            <div class="login-eye-wrap">
              <input id="login-input" class="tinput" type=${show ? 'text' : 'password'}
                     placeholder="Password" autocomplete="current-password"
                     ref=${inputRef}
                     value=${pw}
                     onInput=${e => { setPw(e.target.value); setErr(''); }}
                     onKeyDown=${e => { if (e.key === 'Enter') submit(); }} />
              <button id="login-eye" tabindex="-1"
                      onClick=${() => { setShow(s => !s); inputRef.current?.focus(); }}>
                ${show ? '🙈' : '👁'}
              </button>
            </div>
            <div id="login-err">${err}</div>
            <button id="login-btn" class="btn btn-g" onClick=${submit} disabled=${busy}>
              ${busy ? '...' : 'Unlock →'}
            </button>
          </div>
          <${Disclaimer} />
        </div>
      `;
    }

    function Home({ state, dispatch, onLogout, syncStatus }) {
      return html`
        <div id="s-home" class="screen">
          <div class="home-body">
            <div class="logo">TWORDLE</div>
            <div class="sub">Play with a friend — across the room or across the world</div>
            <button class="btn btn-g" onClick=${() => dispatch({ type: 'PICK_TWO_PLAYER' })}>⚔ 2 Player</button>
            <button class="btn btn-o" onClick=${() => dispatch({ type: 'PICK_SOLO' })}>Solo Play</button>
            <${ActiveGames} state=${state} dispatch=${dispatch} syncStatus=${syncStatus} />
            <button id="logout-btn" onClick=${onLogout}>Sign out</button>
          </div>
          <${Disclaimer} />
        </div>
      `;
    }

    // Step 2 of the 2P setup flow. Names are already in the placeholder game;
    // here the user decides whether to play on one device or across two.
    function ModeChooser({ state, dispatch }) {
      const g = getCurrentGame(state);
      const opp = g?.players[1] || 'your friend';
      return html`
        <div id="s-mode-chooser" class="screen">
          <${TopBar} state=${state} dispatch=${dispatch} title="2 Player" />
          <div class="setup-body">
            <h2>How are you playing?</h2>
            <p class="we-prompt">Pick how you'll exchange turns with <strong>${opp}</strong>.</p>
            <button class="btn btn-g" onClick=${() => dispatch({ type: 'PICK_REMOTE_VARIANT' })}>
              ⚔ Remote
            </button>
            <div class="mc-hint">${RELAY_URL
              ? html`Different devices. Send one invite link to start — after that, turns sync automatically.`
              : html`Different devices. You'll share a link or QR code after each turn.`}</div>
            <button class="btn btn-o" onClick=${() => dispatch({ type: 'PICK_PASS_AND_PLAY' })}>
              ⚔ Pass & Play
            </button>
            <div class="mc-hint">Same device. You'll hand the phone back and forth.</div>
            <${RulesBlurb} />
          </div>
        </div>
      `;
    }

    // Resumeable-game descriptors. A game shows up here if there's some
    // meaningful next-step the user can take with it.
    /** @param {Game} g @returns {?{icon: string, title: string, status: string, mine: boolean}} active-games row, or null to hide */
    function describeGame(g) {
      const opp = g.mode === 'r' && g.players ? g.players[1 - (g.myRole ?? 0)] : null;
      if (g.mode === 's') {
        return {
          icon: '🎯', title: 'Solo game',
          status: g.over ? (g.won ? 'Solved' : 'Stumped') : `${g.guesses.length}/${ROWS} guesses`,
          mine: !g.over,
        };
      }
      if (g.mode === 'l') {
        return {
          icon: '⚔', title: `${g.players[0]} vs ${g.players[1]}`,
          status: g.over ? 'Match over'
                 : (g.challengeFor[0].length === 0 || g.challengeFor[1].length === 0) ? 'Setup in progress'
                 : `Round ${g.round + 1} of ${TOTAL_ROUNDS}`,
          mine: !g.over,
        };
      }
      if (g.mode === 'r') {
        const me = g.myRole ?? 0;
        if (g.over) {
          // Sender hasn't shared the final result yet — they're the URL holder.
          if (g.turnFor !== undefined && g.turnFor !== me) {
            return { icon: '🏁', title: `vs ${opp || 'opponent'}`,
                     status: `Send final result to ${opp || 'them'}`, mine: true };
          }
          return { icon: '🏁', title: `vs ${opp || 'opponent'}`, status: 'Match over', mine: false };
        }
        if (g.challengeFor[0].length === 0 && me === 1) {
          return { icon: '⚔', title: `Challenge from ${g.players[0]}`, status: 'Accept the challenge', mine: true };
        }
        if (g.turnFor === me) {
          return { icon: '⚔', title: `vs ${opp || 'opponent'}`,
                   status: `Your turn · Round ${g.round + 1}`, mine: true };
        }
        return { icon: '⚔', title: `vs ${opp || 'opponent'}`,
                 status: `Waiting on ${opp || 'them'}`, mine: false };
      }
      return null;
    }

    function ActiveGames({ state, dispatch, syncStatus }) {
      const list = Object.values(state.games)
        // Hide leftovers: blank solos and 2P placeholders where no words were
        // entered (cleaned up on GO_HOME, but defensive against tab-close).
        .filter(g => {
          if (g.mode === 's' && g.guesses.length === 0 && !g.over) return false;
          if ((g.mode === 'l' || g.mode === 'r')
              && (g.challengeFor[0]?.length ?? 0) === 0
              && (g.challengeFor[1]?.length ?? 0) === 0) return false;
          return true;
        })
        // Most-recently-touched first.
        .sort((a, b) => (b._lastUpdate || 0) - (a._lastUpdate || 0))
        .map(g => ({ g, d: describeGame(g) }))
        .filter(x => x.d);
      if (list.length === 0) return null;
      const onDismiss = (id, label) => {
        if (confirm(`Remove "${label}" from your list?`)) {
          dispatch({ type: 'DISMISS_GAME', gameId: id });
        }
      };
      return html`
        <div class="active-games">
          <div class="ag-label">Active games</div>
          ${list.map(({ g, d }) => html`
            <div class="ag-row" key=${g.id}>
              <button class="ag-resume" onClick=${() => dispatch({ type: 'RESUME_GAME', gameId: g.id })}>
                <div class="ag-icon">${d.icon}</div>
                <div class="ag-text">
                  <div class="ag-title">${d.title}</div>
                  <div class=${`ag-status ${d.mine ? 'mine' : ''}`}>
                    ${d.status}${syncStatus?.[g.id] === 'failed'
                      ? html` · <span class="ag-warn">⚠ not sent</span>` : ''}
                  </div>
                </div>
              </button>
              <button class="ag-dismiss" onClick=${() => onDismiss(g.id, d.title)} title="Remove">×</button>
            </div>
          `)}
        </div>
      `;
    }

    function Setup({ state, dispatch }) {
      const [p1, setP1] = useState('');
      const [p2, setP2] = useState('');
      const [err, setErr] = useState('');
      const p1Ref = useRef(null);

      useEffect(() => { setTimeout(() => p1Ref.current?.focus(), 250); }, []);

      const submit = () => {
        const a = p1.trim(), b = p2.trim();
        if (!a || !b) return setErr('Enter both names.');
        if (a.toLowerCase() === b.toLowerCase()) return setErr('Use two different names!');
        setErr('');
        dispatch({ type: 'SETUP_DONE', p1: a, p2: b });
      };

      return html`
        <div id="s-setup" class="screen">
          <${TopBar} state=${state} dispatch=${dispatch} title="2 Player" />
          <div class="setup-body">
            <h2>Who's playing?</h2>
            <div class="field"><label>Your name</label>
              <input class="tinput" type="text" placeholder="e.g. Alice" maxlength="16"
                     ref=${p1Ref} value=${p1} onInput=${e => setP1(e.target.value)} /></div>
            <div class="field"><label>Opponent's name</label>
              <input class="tinput" type="text" placeholder="e.g. Bob" maxlength="16"
                     value=${p2} onInput=${e => setP2(e.target.value)}
                     onKeyDown=${e => { if (e.key === 'Enter') submit(); }} /></div>
            <div class="err">${err}</div>
            <button class="btn btn-g" onClick=${submit}>Let's Play!</button>
          </div>
        </div>
      `;
    }

    // Initiator's first turn in a remote match: enter both names and the 3
    // secret words for the opponent in one screen. On submit, the game is
    // created and we transition to the share screen.
    // Opponent's first turn: just received an invite URL. The game already
    // contains the initiator's name + their 3 words for us. We enter our
    // 3 words for them, then transition to share back.
    function AcceptChallenge({ state, dispatch }) {
      const g = getCurrentGame(state);
      const initiator = g?.players[0] || 'Your friend';
      const opponent = g?.players[1] || 'You';
      const [words, setWords] = useState(['', '', '']);
      const [reveal, setReveal] = useState([false, false, false]);
      const [errs, setErrs] = useState(['', '', '']);
      const [globalErr, setGlobalErr] = useState('');
      const refs = [useRef(null), useRef(null), useRef(null)];

      useEffect(() => { setTimeout(() => refs[0].current?.focus(), 250); }, []);

      const setWord = (i, v) => {
        const cleaned = v.replace(/[^a-zA-Z]/g, '');
        setWords(prev => { const w = prev.slice(); w[i] = cleaned; return w; });
        setErrs(prev => { const e = prev.slice(); e[i] = ''; return e; });
        setGlobalErr('');
      };
      const toggleEye = i => setReveal(prev => { const r = prev.slice(); r[i] = !r[i]; return r; });
      const onKey = (e, i) => {
        if (e.key === 'Enter') { if (i < TOTAL_ROUNDS - 1) refs[i+1].current?.focus(); else submit(); }
      };
      const submit = () => {
        let ok = true;
        const newErrs = ['', '', ''];
        const upper = [];
        for (let i = 0; i < TOTAL_ROUNDS; i++) {
          const raw = words[i].trim().toLowerCase();
          if (raw.length !== 5) { newErrs[i] = 'Must be exactly 5 letters.'; ok = false; }
          else if (!ANSWERS_SET.has(raw)) {
            newErrs[i] = `"${raw.toUpperCase()}" isn't valid — try a more common word.`; ok = false;
          } else upper.push(raw.toUpperCase());
        }
        setErrs(newErrs);
        if (!ok) return;
        if (new Set(upper).size < upper.length) return setGlobalErr('Each round needs a different word!');
        dispatch({ type: 'REMOTE_ACCEPT_DONE', words: upper });
      };

      return html`
        <div id="s-accept-challenge" class="screen">
          <${TopBar} state=${state} dispatch=${dispatch} badge=${`${initiator}'s challenge`} />
          <div class="we-body">
            <p class="we-prompt" dangerouslySetInnerHTML=${{
              __html: `<strong>${initiator}</strong> challenged <strong>${opponent}</strong> to a Twordle match.<br>Enter 3 secret words for them to guess — one per round.`,
            }}></p>
            <${RulesBlurb} />
            <div class="we-fields">
              ${[0,1,2].map(i => html`
                <div class="we-row" key=${i}>
                  <label>Round ${i + 1}</label>
                  <div class="wrap-eye">
                    <input class=${`tinput word-w-input ${reveal[i] ? '' : 'masked'}`} type="text" maxlength="5"
                           placeholder="· · · · ·" autocomplete="off" autocapitalize="characters"
                           autocorrect="off" spellcheck="false"
                           ref=${refs[i]} value=${words[i]}
                           onInput=${e => setWord(i, e.target.value)}
                           onKeyDown=${e => onKey(e, i)} />
                    ${!reveal[i] && words[i] && html`<div class="word-input-mask" aria-hidden="true">${'●'.repeat(words[i].length)}</div>`}
                    <button class="eye-btn" onClick=${() => toggleEye(i)}>${reveal[i] ? '🙈' : '👁'}</button>
                  </div>
                  <div class="we-row-err">${errs[i]}</div>
                </div>
              `)}
            </div>
            <div class="err">${globalErr}</div>
            <button class="btn btn-g" onClick=${submit}>Send Back →</button>
          </div>
        </div>
      `;
    }

    // Shared share/sync affordance for remote handoffs, in two variants:
    //   'invite'  — prominent share UI for the moments a manual share is the
    //               real transport: the mandatory first invite, or ANY handoff
    //               when the relay is disabled. Big Share / Copy + QR.
    //   'waiting' — relay-primary: a sync chip (Syncing… / Synced ✓ / failed)
    //               plus a demoted "Nudge" button with the raw link + QR tucked
    //               behind a toggle. The relay does the real delivery; the link
    //               is just a notification poke (we have no push) / offline path.
    //               On sync failure the nudge is elevated, since that's exactly
    //               when the manual fallback matters.
    function RelayShareBlock({ game, syncStatus, variant }) {
      const g = game;
      const me = g.myRole ?? 0;
      const opp = g.players[1 - me] || 'your opponent';
      const [copied, setCopied] = useState(false);
      const [showOffline, setShowOffline] = useState(variant === 'invite');
      const stateUrl = useMemo(() => buildShareUrl(g), [g]);   // full state (offline-capable)
      const qr = useMemo(() => showOffline ? renderQRPath(stateUrl) : null, [showOffline, stateUrl]);

      // The online nudge carries just the game id — the relay supplies state — so
      // it's never stale and doesn't litter the thread with mid-game links. But
      // if this turn hasn't synced (offline / relay off), that id link would have
      // nothing to resolve to, so we send the full-state link instead.
      const synced = syncStatus?.[g.id] === 'synced';
      const nudgeUrl = (variant === 'waiting' && synced) ? buildNudgeUrl(g) : stateUrl;

      const shareText = g.over ? `The final result from our Twordle match`
        : (g.turnCounter === 1 ? `I'm challenging you to Twordle!` : `Your turn in Twordle`);
      const canWebShare = typeof navigator !== 'undefined' && typeof navigator.share === 'function'
        && (!navigator.canShare || navigator.canShare({ url: nudgeUrl, text: shareText }));

      const copy = async (txt) => {
        try { await navigator.clipboard.writeText(txt); } catch (e) {}
        setCopied(true); setTimeout(() => setCopied(false), 1800);
      };
      const share = async (u) => {
        try { await navigator.share({ url: u, text: shareText, title: 'Twordle' }); } catch (e) {}
      };

      // Full-state link + QR (offline pass). Shown by default in 'invite';
      // tucked behind a toggle in 'waiting'.
      const offlineReveal = html`
        ${showOffline && html`
          ${qr && html`
            <div class="qr-box">
              <svg viewBox=${`0 0 ${qr.size} ${qr.size}`} xmlns="http://www.w3.org/2000/svg">
                <rect width=${qr.size} height=${qr.size} fill="white" />
                <path d=${qr.d} fill="black" />
              </svg>
            </div>
          `}
          <div class="share-url" onClick=${() => copy(stateUrl)}>${stateUrl}</div>
        `}
      `;

      if (variant === 'invite') {
        // First contact — always full state so it works even if the recipient
        // or the relay is offline.
        return html`
          <div class="relay-share">
            ${offlineReveal}
            ${canWebShare && html`<button class="btn btn-g" onClick=${() => share(stateUrl)}>Share →</button>`}
            <button class=${`btn ${canWebShare ? 'btn-o' : 'btn-g'}`} onClick=${() => copy(stateUrl)}>
              ${copied ? 'Copied! ✓' : 'Copy Link'}
            </button>
            <button class="qr-toggle" onClick=${() => setShowOffline(s => !s)}>
              ${showOffline ? 'Hide QR Code' : 'Show QR Code'}
            </button>
          </div>
        `;
      }

      // variant === 'waiting' — relay-primary. Nudge = stateless id link; the
      // offline pass (full state + QR) sits behind a toggle.
      const status = syncStatus?.[g.id] || 'syncing';
      const failed = status === 'failed';
      const chip = failed
        ? html`<div class="sync-chip failed">⚠ Couldn't reach ${opp}'s device</div>`
        : status === 'synced'
        ? html`<div class="sync-chip synced">Synced ✓</div>`
        : html`<div class="sync-chip syncing">Syncing…</div>`;
      return html`
        <div class="relay-share">
          ${chip}
          <button class=${`btn ${failed ? 'btn-g' : 'btn-o'}`}
                  onClick=${canWebShare ? () => share(nudgeUrl) : () => copy(nudgeUrl)}>
            ${copied ? 'Copied! ✓' : `${failed ? 'Send' : 'Nudge'} ${opp} a link`}
          </button>
          <button class="qr-toggle" onClick=${() => setShowOffline(s => !s)}>
            ${showOffline ? 'Hide offline options' : 'No internet? Pass it manually'}
          </button>
          ${showOffline && html`
            <div class="offline-note">
              This link & QR carry the whole game, so they work with no connection —
              for SMS-only, or scanning in person.
            </div>
          `}
          ${offlineReveal}
          ${showOffline && html`
            <button class="btn btn-o" onClick=${() => copy(stateUrl)}>
              ${copied ? 'Copied! ✓' : 'Copy offline link'}
            </button>
          `}
        </div>
      `;
    }

    // Replaces the local Handoff screen when it's time to send the URL out.
    // With the relay on, most handoffs are "waiting" (auto-delivered); only the
    // first invite (opponent hasn't entered words yet) needs a manual share.
    function ShareScreen({ state, dispatch, syncStatus }) {
      const g = getCurrentGame(state) ?? emptyGame();
      const recipient = g.players[g.turnFor ?? 1] || 'your opponent';
      const relayOn = !!RELAY_URL;
      // Manual share is the real transport only for the first invite (opponent
      // hasn't entered words yet, so they can't be polling) or when the relay is
      // off. Everything else is relay-delivered → show the waiting affordance.
      const firstInvite = (g.challengeFor[0]?.length ?? 0) === 0;
      const variant = (firstInvite || !relayOn) ? 'invite' : 'waiting';

      // If I just got stumped on the turn I'm handing off, reveal my answer here
      // (the ephemeral board toast is long gone by the time I look back). The
      // reviewBoard snapshot of my just-played turn carries my target word.
      const rb = g.reviewBoard;
      const justStumped = !!rb && (rb.gs?.length ?? 0) >= ROWS
        && rb.sc?.length && !rb.sc[rb.sc.length - 1].every(s => s === 'correct');

      let icon, heading, sub;
      if (variant === 'invite') {
        icon = '📨';
        heading = g.turnCounter === 1 ? `Invite ${recipient}` : 'Send the link';
        sub = g.turnCounter === 1
          ? `Send this to <strong>${recipient}</strong> to accept and play.${relayOn ? ' After this first invite, turns sync on their own.' : ''}`
          : `Send this to <strong>${recipient}</strong> to continue the match.`;
      } else {
        icon = '⏳';
        heading = `Waiting on ${recipient}`;
        sub = `Your move is in — <strong>${recipient}</strong> gets it automatically. Nudge them if you like, or just sit tight; this updates on its own.`;
      }

      return html`
        <div id="s-share" class="screen">
          <${TopBar} state=${state} dispatch=${dispatch} badge=${variant === 'invite' ? 'Invite' : 'Waiting'} />
          <div class="ho-body">
            <div class="ho-icon">${icon}</div>
            <h2>${heading}</h2>
            <p dangerouslySetInnerHTML=${{ __html: sub }}></p>
            ${justStumped && html`
              <div class="stump-reveal">You were stumped — the word was <strong>${rb.tg}</strong></div>
            `}
            <${RelayShareBlock} game=${g} syncStatus=${syncStatus} variant=${variant} />
            <button class="btn btn-o" onClick=${() => dispatch({ type: 'GO_HOME' })}>
              ${variant === 'waiting' ? 'Back to games' : 'Done'}
            </button>
          </div>
        </div>
      `;
    }

    function WordEntry({ state, dispatch }) {
      const g = getCurrentGame(state);
      // New phase semantics: phase = which player is currently setting up.
      //   0 → P1 (initiator), 1 → P2 (opponent).
      // Setter is that player; their words are FOR the OTHER player to guess.
      const phase = g?.wordEntryPhase ?? 0;
      const setterIdx  = phase;
      const guesserIdx = 1 - phase;
      const setter  = g?.players[setterIdx] ?? '';
      const guesser = g?.players[guesserIdx] ?? '';

      const [words, setWords] = useState(['', '', '']);
      const [reveal, setReveal] = useState([false, false, false]);
      const [errs, setErrs] = useState(['', '', '']);
      const [globalErr, setGlobalErr] = useState('');
      const refs = [useRef(null), useRef(null), useRef(null)];

      useEffect(() => { setTimeout(() => refs[0].current?.focus(), 250); }, [phase]);

      const setWord = (i, v) => {
        const cleaned = v.replace(/[^a-zA-Z]/g, '');
        setWords(prev => { const w = prev.slice(); w[i] = cleaned; return w; });
        setErrs(prev => { const e = prev.slice(); e[i] = ''; return e; });
        setGlobalErr('');
      };

      const toggleEye = i => setReveal(prev => { const r = prev.slice(); r[i] = !r[i]; return r; });

      const onKey = (e, i) => {
        if (e.key === 'Enter') {
          if (i < TOTAL_ROUNDS - 1) refs[i + 1].current?.focus();
          else submit();
        }
      };

      const submit = () => {
        let ok = true;
        const newErrs = ['', '', ''];
        const upper = [];
        for (let i = 0; i < TOTAL_ROUNDS; i++) {
          const raw = words[i].trim().toLowerCase();
          if (raw.length !== 5) { newErrs[i] = 'Must be exactly 5 letters.'; ok = false; }
          else if (!ANSWERS_SET.has(raw)) {
            newErrs[i] = `"${raw.toUpperCase()}" isn't valid — try a more common word.`; ok = false;
          } else {
            upper.push(raw.toUpperCase());
          }
        }
        setErrs(newErrs);
        if (!ok) return;
        if (new Set(upper).size < upper.length) {
          setGlobalErr('Each round needs a different word!');
          return;
        }
        dispatch({ type: 'WORD_ENTRY_DONE', words: upper });
      };

      return html`
        <div id="s-word-entry" class="screen">
          <${TopBar} state=${state} dispatch=${dispatch} badge=${`${setter}'s words`}
                     cancelDirty=${words.some(w => w.trim().length > 0)} />
          <div class="we-body">
            <p class="we-prompt" dangerouslySetInnerHTML=${{
              __html: `<strong>${setter}</strong>, enter 3 secret words for <strong>${guesser}</strong> to solve — one per round:`
            }}></p>
            <div class="we-fields">
              ${[0,1,2].map(i => html`
                <div class="we-row" key=${i}>
                  <label>Round ${i + 1}</label>
                  <div class="wrap-eye">
                    <input class=${`tinput word-w-input ${reveal[i] ? '' : 'masked'}`} type="text" maxlength="5"
                           placeholder="· · · · ·" autocomplete="off" autocapitalize="characters"
                           autocorrect="off" spellcheck="false"
                           ref=${refs[i]} value=${words[i]}
                           onInput=${e => setWord(i, e.target.value)}
                           onKeyDown=${e => onKey(e, i)} />
                    ${!reveal[i] && words[i] && html`<div class="word-input-mask" aria-hidden="true">${'●'.repeat(words[i].length)}</div>`}
                    <button class="eye-btn" onClick=${() => toggleEye(i)}>${reveal[i] ? '🙈' : '👁'}</button>
                  </div>
                  <div class="we-row-err">${errs[i]}</div>
                </div>
              `)}
            </div>
            <div class="err">${globalErr}</div>
            <button class="btn btn-g" onClick=${submit}>Submit Words →</button>
          </div>
        </div>
      `;
    }

    function Handoff({ state, dispatch }) {
      const { badge, icon, title, desc, btnText, next } = state.handoff;
      return html`
        <div id="s-handoff" class="screen">
          <${TopBar} state=${state} dispatch=${dispatch} badge=${badge} />
          <div class="ho-body">
            <div class="ho-icon">${icon}</div>
            <h2>${title}</h2>
            <p dangerouslySetInnerHTML=${{ __html: desc }}></p>
            <button class="btn btn-g" onClick=${() => dispatch(next)}>${btnText}</button>
          </div>
        </div>
      `;
    }

    function Game({ state, dispatch }) {
      const { pendingContinue, ui, revealing } = state;
      const game = getCurrentGame(state) ?? emptyGame();
      const { guesses, scores, current, target, over, players } = game;
      const mode = game.mode;
      // Local aliases that preserve readability of the surrounding code:
      const tp = { players, round: game.round, turn: game.turn, results: game.results };

      // Reveal animation: when a new guess is committed, animate the new row.
      // `revealing` (in reducer state) blocks input. Per-tile colors appear
      // at the flip midpoint via `revealedCols` (local UI state).
      const [revealedCols, setRevealedCols] = useState(COLS); // default: all shown (for restored states)
      const [bouncing, setBouncing] = useState(false);
      const [showContinueBtn, setShowContinueBtn] = useState(false);
      const prevGuessCountRef = useRef(guesses.length);
      const continueTimerRef = useRef(null);

      // When a new guess is committed, run the reveal animation and then
      // dispatch REVEAL_DONE (after any win/lose toast delay).
      useEffect(() => {
        if (guesses.length <= prevGuessCountRef.current) {
          prevGuessCountRef.current = guesses.length;
          return;
        }
        prevGuessCountRef.current = guesses.length;
        setRevealedCols(0);

        const FD = 300; // flip duration ms (matches CSS)
        const DL = 300; // per-tile stagger
        const timers = [];
        for (let c = 0; c < COLS; c++) {
          timers.push(setTimeout(() => setRevealedCols(c + 1), c * DL + FD / 2));
        }
        const animMs = (COLS - 1) * DL + FD + 50;
        timers.push(setTimeout(() => {
          const lastScore = scores[scores.length - 1];
          const won = lastScore.every(s => s === 'correct');
          const lost = !won && guesses.length >= ROWS;
          if (won) {
            setBouncing(true);
            timers.push(setTimeout(() => setBouncing(false), 800));
            const lastIdx = guesses.length - 1;
            const msgs = ['Genius!','Magnificent!','Impressive!','Splendid!','Great!','Phew!'];
            timers.push(setTimeout(() => toast(msgs[Math.min(lastIdx, msgs.length - 1)], 2200), 400));
            if (mode === 's') {
              timers.push(setTimeout(() => dispatch({ type: 'REVEAL_DONE' }), 2400));
            } else {
              dispatch({ type: 'REVEAL_DONE' });
            }
          } else if (lost) {
            timers.push(setTimeout(() => toast(target, 3500), 200));
            if (mode === 's') {
              timers.push(setTimeout(() => dispatch({ type: 'REVEAL_DONE' }), 3600));
            } else {
              dispatch({ type: 'REVEAL_DONE' });
            }
          } else {
            dispatch({ type: 'REVEAL_DONE' });
          }
        }, animMs));
        return () => timers.forEach(clearTimeout);
      }, [guesses.length]);

      // If state was restored mid-reveal, clear the flag immediately so input works.
      useEffect(() => {
        if (revealing && guesses.length === prevGuessCountRef.current) {
          // No new guess landed since mount but reducer says revealing — clear it.
          dispatch({ type: 'REVEAL_DONE' });
        }
      }, []);

      // Continue overlay (2-player): fades in 1.8s after game-over
      useEffect(() => {
        if (mode === 's' || !pendingContinue) {
          setShowContinueBtn(false);
          if (continueTimerRef.current) { clearTimeout(continueTimerRef.current); continueTimerRef.current = null; }
          return;
        }
        continueTimerRef.current = setTimeout(() => setShowContinueBtn(true), 1800);
        return () => {
          if (continueTimerRef.current) { clearTimeout(continueTimerRef.current); continueTimerRef.current = null; }
        };
      }, [mode, pendingContinue]);

      // Error feedback (shake + toast): reducer bumps ui.errorTick when a guess
      // fails validation. Component reacts here.
      const prevErrorTickRef = useRef(ui.errorTick);
      useEffect(() => {
        if (ui.errorTick > prevErrorTickRef.current) {
          prevErrorTickRef.current = ui.errorTick;
          shakeCurrentRow();
          if (ui.errorMsg) toast(ui.errorMsg);
        }
      }, [ui.errorTick]);

      // Keyboard color: derive from all completed guesses (precedence correct > present > absent)
      const keyState = useMemo(() => {
        const map = {};
        const rank = { absent: 1, present: 2, correct: 3 };
        for (let g = 0; g < guesses.length; g++) {
          for (let c = 0; c < COLS; c++) {
            const k = guesses[g][c];
            const s = scores[g][c];
            if (!map[k] || rank[s] > rank[map[k]]) map[k] = s;
          }
        }
        return map;
      }, [guesses, scores]);

      const handleKey = useCallback(k => {
        if (k === '⌫') dispatch({ type: 'DELETE_LETTER' });
        else if (k === 'Enter') dispatch({ type: 'SUBMIT_GUESS' });
        else if (/^[A-Z]$/.test(k)) dispatch({ type: 'TYPE_LETTER', letter: k });
      }, [dispatch]);

      // Physical keyboard
      useEffect(() => {
        const onKey = e => {
          if (e.ctrlKey || e.altKey || e.metaKey) return;
          if (e.key === 'Enter') handleKey('Enter');
          else if (e.key === 'Backspace') handleKey('⌫');
          else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
        };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [handleKey]);

      // Pop animation on the current row's last typed tile
      const [popKey, setPopKey] = useState(0);
      const prevCurLen = useRef(current.length);
      useEffect(() => {
        if (current.length > prevCurLen.current) setPopKey(k => k + 1);
        prevCurLen.current = current.length;
      }, [current]);

      const [shakeRow, setShakeRow] = useState(null);
      const shakeCurrentRow = () => {
        const r = guesses.length;
        setShakeRow(r);
        setTimeout(() => setShakeRow(s => (s === r ? null : s)), 500);
      };

      const meta = (mode === 'l' || mode === 'r')
        ? `Round ${tp.round + 1} of ${TOTAL_ROUNDS} · ${tp.players[tp.turn]}'s turn`
        : '';

      // Render board: 6 rows × 5 cols
      const tiles = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          tiles.push(renderTile(r, c));
        }
      }

      function renderTile(r, c) {
        const isSubmitted = r < guesses.length;
        const isCurrent = r === guesses.length && !over;
        let letter = '';
        let state = '';
        let extraClass = '';
        let style = '';

        if (isSubmitted) {
          letter = guesses[r][c];
          // Show color: if this row is still revealing, only show colored once flip midpoint passed
          const isLastSubmitted = r === guesses.length - 1;
          if (isLastSubmitted && revealing) {
            extraClass = 'flip';
            style = `animation-delay:${c * 300}ms`;
            if (c < revealedCols) state = scores[r][c];
          } else {
            state = scores[r][c];
          }
          if (bouncing && isLastSubmitted) {
            extraClass = (extraClass + ' bnc').trim();
            style = `animation-delay:${c * 100}ms`;
          }
        } else if (isCurrent) {
          letter = current[c] || '';
        }

        const filled = !!letter;
        const popClass = (isCurrent && c === current.length - 1) ? `pop-${popKey}` : '';
        const shakeClass = (r === shakeRow) ? 'row-shake' : '';

        return html`
          <div
            key=${r * COLS + c}
            class=${`tile ${filled ? 'filled' : ''} ${extraClass} ${shakeClass} ${popClass ? 'pop' : ''}`.replace(/\s+/g,' ').trim()}
            data-state=${state || undefined}
            style=${style}
          >${letter}</div>
        `;
      }

      const rightAction = mode === 's'
        ? html`<button class="tb-new-btn" onClick=${() => dispatch({ type: 'NEW_SOLO_GAME' })}>New Game</button>`
        : null;

      return html`
        <div id="s-game" class="screen">
          <${TopBar} state=${state} dispatch=${dispatch} title="TWORDLE" meta=${meta || null} right=${rightAction} />
          <div id="game-main">
            <div id="board">${tiles}</div>
            <div id="keyboard">
              ${KEYROWS.map((row, ri) => html`
                <div class="krow" key=${ri}>
                  ${row.map(k => html`
                    <button
                      key=${k}
                      class=${`key ${(k === 'Enter' || k === '⌫') ? 'wide' : ''}`}
                      data-state=${keyState[k] || undefined}
                      onClick=${() => handleKey(k)}>${k}</button>
                  `)}
                </div>
              `)}
            </div>
            ${over && !game.won && (mode === 'l' || mode === 'r') && html`
              <div id="stump-overlay">The word was <strong>${target}</strong></div>
            `}
            ${showContinueBtn && html`
              <div id="cont-overlay">
                <button class="btn btn-g" onClick=${() => dispatch({ type: 'CONTINUE_FROM_TURN' })}>
                  ${tp.turn === 0 ? `Pass to ${tp.players[1]} →` : 'See Round Results →'}
                </button>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function SoloSummary({ state, dispatch }) {
      const g = getCurrentGame(state) ?? emptyGame();
      const won = g.won;
      const word = g.target;
      const guesses = g.guesses.length;
      const sub = won
        ? (guesses === 1 ? 'A hole-in-one. Legendary.'
           : guesses <= 3 ? 'Impressive — well ahead of average.'
           : guesses <= 5 ? 'Solid solve!'
           : 'Got there in the end!')
        : 'Better luck next time — that one was tricky.';
      return html`
        <div id="s-solo-summary" class="screen">
          <${TopBar} state=${state} dispatch=${dispatch} />
          <div class="ss-body">
            <div class="ss-icon">${won ? '🎉' : '😔'}</div>
            <h2>${won ? `Solved in ${guesses}!` : 'Stumped!'}</h2>
            <div class=${`ss-word ${won ? '' : 'miss'}`}>${word}</div>
            <p class="ss-sub">${sub}</p>
            <button class="ss-cta" onClick=${() => dispatch({ type: 'PICK_TWO_PLAYER' })}>
              Ready for a real challenge? <strong>⚔ 2 Player</strong>
            </button>
            <div class="ss-actions">
              <button class="btn btn-g" onClick=${() => dispatch({ type: 'NEW_SOLO_GAME' })}>Play Again</button>
              <button class="btn btn-o" onClick=${() => dispatch({ type: 'GO_HOME' })}>← Change Mode</button>
            </div>
          </div>
        </div>
      `;
    }

    function Scoreboard({ players, results, roundsPlayed, challengeFor }) {
      return html`
        <div class="scoreboard">
          <div class="sb-head">
            <span></span>
            ${[0,1,2].map(r => html`<span key=${r}>R${r + 1}</span>`)}
          </div>
          ${[0,1].map(pi => html`
            <div class="sb-row" key=${pi}>
              <span class="sb-name">${players[pi]}</span>
              ${[0,1,2].map(r => {
                const res = r < roundsPlayed ? results[r][pi] : null;
                if (!res) return html`<span class="sb-cell na" key=${r}>—</span>`;
                if (res.solved) return html`<span class="sb-cell ok" key=${r}>${res.guesses}</span>`;
                // Stumped: reveal the word that beat them (instead of a bare ✗).
                const word = challengeFor?.[pi]?.[r];
                return word
                  ? html`<span class="sb-cell word" key=${r}>${word}</span>`
                  : html`<span class="sb-cell no" key=${r}>✗</span>`;
              })}
            </div>
          `)}
        </div>
      `;
    }

    // Shown to the receiver right after they open a share URL with a
    // reviewBoard payload — lets them see the opponent's actual guesses and
    // tile colors before moving on to the round-summary / next play / game-over.
    function ReviewBoard({ state, dispatch }) {
      const g = getCurrentGame(state) ?? emptyGame();
      const rb = g.reviewBoard;
      if (!rb) {
        // Defensive: navigate home if somehow we landed here without data.
        return html`<div class="screen"><${TopBar} state=${state} dispatch=${dispatch} />
          <button class="btn btn-g" onClick=${() => dispatch({ type: 'GO_HOME' })}>Home</button></div>`;
      }
      const playerName = g.players[rb.p] || `Player ${rb.p + 1}`;
      const lastScore = rb.sc[rb.sc.length - 1];
      const won = !!lastScore && lastScore.every(s => s === 'correct');
      const guessCount = rb.gs.length;
      const tries = guessCount === 1 ? 'try' : 'tries';

      return html`
        <div id="s-review" class="screen">
          <${TopBar} state=${state} dispatch=${dispatch} badge=${`Round ${rb.r + 1}`} />
          <div class="rv-body">
            <div class="rv-target">Your word: <strong>${rb.tg}</strong></div>
            <div class="rv-board">
              ${rb.gs.map((guess, ri) => html`
                <div class="rv-row" key=${ri}>
                  ${[0,1,2,3,4].map(ci => html`
                    <div class="tile filled" data-state=${rb.sc[ri][ci]} key=${ci}>${guess[ci]}</div>
                  `)}
                </div>
              `)}
            </div>
            <h2>${won ? `${playerName} solved it in ${guessCount}!` : `${playerName} was stumped.`}</h2>
            <p>
              ${won
                ? `Took them ${guessCount} ${tries} to crack the word.`
                : `They used all 6 guesses without getting it.`}
            </p>
            <div class="rs-label">Score so far</div>
            <${Scoreboard} players=${g.players} results=${g.results}
                           roundsPlayed=${rb.r + 1} challengeFor=${g.challengeFor} />
            <button class="btn btn-g" onClick=${() => dispatch({ type: 'REVIEW_DONE' })}>
              Continue →
            </button>
          </div>
        </div>
      `;
    }

    function RoundSummary({ state, dispatch, syncStatus }) {
      const g = getCurrentGame(state) ?? emptyGame();
      const tp = { players: g.players, results: g.results };
      // We land here right after the second player finishes the round, so
      // the "just-completed" round is the one currently pointed at by g.round.
      const completedRoundIdx = g.round;
      const next = completedRoundIdx + 2;
      const r0 = tp.results[completedRoundIdx][0];
      const r1 = tp.results[completedRoundIdx][1];
      const t0 = tp.results.slice(0, completedRoundIdx + 1).reduce((s, r) => s + r[0].guesses, 0);
      const t1 = tp.results.slice(0, completedRoundIdx + 1).reduce((s, r) => s + r[1].guesses, 0);
      const verdict = r0.solved && r1.solved
        ? `Both solved it! Heading to Round ${next}...`
        : `Both stumped! No winner yet — Round ${next} is next!`;

      // Action button branches by mode:
      //   local 2P: standard handoff → next player's turn screen
      //   remote, sender (I just played turn=1): "Send to opponent for next round"
      //   remote, receiver (URL just arrived): "Continue to next round" → game
      let action;
      if (g.mode === 'r') {
        const me = g.myRole ?? 0;
        const opp = g.players[1 - me] || 'opponent';
        const isSender = me === g.turn;
        if (isSender) {
          // Relay on: the round-summary already auto-pushed, so this is a waiting
          // state, not a manual send. Relay off: keep the explicit send button.
          action = RELAY_URL ? html`
            <p class="rs-wait">Waiting on ${opp} to play Round ${next}…</p>
            <${RelayShareBlock} game=${g} syncStatus=${syncStatus} variant="waiting" />
            <button class="btn btn-o" onClick=${() => dispatch({ type: 'GO_HOME' })}>Back to games</button>
          ` : html`<button class="btn btn-g"
                                onClick=${() => dispatch({ type: 'GOTO_SHARE' })}>
            Send to ${opp} for Round ${next} →
          </button>`;
        } else {
          action = html`<button class="btn btn-g"
                                onClick=${() => dispatch({ type: 'REMOTE_ADVANCE_NEXT_ROUND' })}>
            Play Round ${next} →
          </button>`;
        }
      } else {
        action = html`<button class="btn btn-g"
                              onClick=${() => dispatch({ type: 'NEXT_ROUND_HANDOFF', nextRound: completedRoundIdx + 1 })}>
          Start Round ${next} →
        </button>`;
      }

      return html`
        <div id="s-round-summary" class="screen">
          <${TopBar} state=${state} dispatch=${dispatch} badge=${`After Round ${completedRoundIdx + 1}`} />
          <div class="rs-body">
            <div class="rs-label">Scoreboard</div>
            <${Scoreboard} players=${tp.players} results=${tp.results} roundsPlayed=${completedRoundIdx + 1} challengeFor=${g.challengeFor} />
            <div class="totals-row">
              <span class="tot-item">${tp.players[0]}: <strong>${t0}</strong> guess${t0 !== 1 ? 'es' : ''}</span>
              <span class="tot-item">${tp.players[1]}: <strong>${t1}</strong> guess${t1 !== 1 ? 'es' : ''}</span>
            </div>
            <p class="rs-verdict">${verdict}</p>
            ${action}
          </div>
        </div>
      `;
    }

    function GameOver({ state, dispatch, syncStatus }) {
      const g = getCurrentGame(state) ?? emptyGame();
      const tp = { players: g.players, results: g.results };
      const { type, winnerIdx, roundsPlayed, t0, t1 } = gameOverDetails(g);

      let icon, headlineHtml, subHtml;
      if (type === 'stump') {
        const winner = tp.players[winnerIdx];
        const loser  = tp.players[1 - winnerIdx];
        icon = '🏆';
        headlineHtml = `<span class="go-wname">${winner}</span> wins!`;
        subHtml = `${loser} was stumped in Round ${roundsPlayed} — ${winner} wasn't.`;
      } else if (type === 'guesses') {
        const winner = tp.players[winnerIdx];
        icon = '🏆';
        headlineHtml = `<span class="go-wname">${winner}</span> wins!`;
        subHtml = `All 3 rounds solved! ${tp.players[0]}: ${t0} total guesses · ${tp.players[1]}: ${t1} total guesses`;
      } else {
        icon = '🤝';
        headlineHtml = `It's a Tie!`;
        subHtml = `Both players used ${t0} total guesses across 3 rounds.<br>Time for some trash talk... 😤`;
      }

      // Remote sender = I just played the game-ending move; the encoded URL is
      // pointed at the opponent so they can see the final result. Embed the
      // share affordance right in the game-over screen (more prominent than a
      // separate share screen that can be tapped past without sharing).
      const isRemoteSender = g.mode === 'r'
        && g.myRole !== undefined && g.turnFor !== undefined
        && g.turnFor !== g.myRole;
      const opponent = g.mode === 'r' ? (g.players[1 - (g.myRole ?? 0)] || 'your opponent') : '';
      const relayOn = !!RELAY_URL;

      return html`
        <div id="s-game-over" class="screen">
          <${TopBar} state=${state} dispatch=${dispatch} />
          <div class="go-body">
            <div class="go-icon">${icon}</div>
            <h2 dangerouslySetInnerHTML=${{ __html: headlineHtml }}></h2>
            <p class="go-sub" dangerouslySetInnerHTML=${{ __html: subHtml }}></p>
            <div class="go-detail">
              <${Scoreboard} players=${tp.players} results=${tp.results} roundsPlayed=${roundsPlayed} challengeFor=${g.challengeFor} />
            </div>
            ${isRemoteSender && html`
              <div class="go-share">
                <p class="go-share-prompt" dangerouslySetInnerHTML=${{
                  __html: relayOn
                    ? `The final result is on its way to <strong>${opponent}</strong>.`
                    : `📨 Send the final result to <strong>${opponent}</strong> so they can see how it ended.`
                }}></p>
                <${RelayShareBlock} game=${g} syncStatus=${syncStatus}
                                    variant=${relayOn ? 'waiting' : 'invite'} />
              </div>
            `}
            <button class="btn btn-g" onClick=${() => dispatch({ type: 'REMATCH' })}>
              Rematch ${g.mode === 'r' ? (g.players[1 - (g.myRole ?? 0)] || '') : ''} →
            </button>
            <button class="btn btn-o" onClick=${() => dispatch({ type: 'GO_HOME',
                      delivered: isRemoteSender && relayOn && syncStatus?.[g.id] === 'synced' })}>
              ${isRemoteSender ? 'Done' : 'Home'}
            </button>
          </div>
        </div>
      `;
    }

    render(h(App), document.getElementById('app'));
  </script>
</body>
</html>
